openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Clinical decision-support research analysis
  - name: demos
    description: Synthetic demonstration cases
  - name: evaluation
    description: Research evaluation framework
  - name: ingestion
    description: Knowledge silo ingestion
  - name: reconciliation
    description: Clinical medication reconciliation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: healthCheckAlias
      tags: [health]
      summary: Health check alias
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeCase
      tags: [analysis]
      summary: Analyze a patient case through the multi-agent DEA pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientProfileInput"
      responses:
        "200":
          description: Traceable analysis report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisReport"
        "400":
          description: Invalid patient profile
  /demo-cases:
    get:
      operationId: listDemoCases
      tags: [demos]
      summary: List synthetic demonstration cases
      responses:
        "200":
          description: Synthetic cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoCase"
  /evaluate:
    post:
      operationId: evaluateFramework
      tags: [evaluation]
      summary: Return the evaluation framework with pending benchmark status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationInput"
      responses:
        "200":
          description: Evaluation framework result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
  /ingest:
    post:
      operationId: ingestDocument
      tags: [ingestion]
      summary: Register a document in one independent knowledge silo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestDocumentInput"
      responses:
        "201":
          description: Ingestion receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestReceipt"
  /knowledge-stats:
    get:
      operationId: getKnowledgeStats
      tags: [ingestion]
      summary: Return persisted ChromaDB knowledge-silo status
      responses:
        "200":
          description: Knowledge-silo status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeStats"
  /reconcile:
    post:
      operationId: reconcileMedications
      tags: [reconciliation]
      summary: Reconcile medication lists and detect omissions, discrepancies, and high-risk interactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconciliationInput"
      responses:
        "200":
          description: Medication reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationReconciliationReport"
        "400":
          description: Invalid reconciliation input
  /what-if:
    post:
      operationId: whatIfSimulation
      tags: [analysis]
      summary: Fast What-If simulation with modified clinical parameters and custom DEA weights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatIfInput"
      responses:
        "200":
          description: Simulation analysis report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisReport"
        "400":
          description: Invalid simulation input
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PatientProfileInput:
      type: object
      required: [age, sex, diseases, medications, symptoms, lab_values, allergies, conditions]
      properties:
        age:
          type: number
          minimum: 0
          maximum: 130
        sex:
          type: string
        diseases:
          type: array
          items: { type: string }
        medications:
          type: array
          items: { type: string }
        secondary_medications:
          type: array
          items: { type: string }
        symptoms:
          type: array
          items: { type: string }
        lab_values:
          type: object
          additionalProperties: { type: string }
        allergies:
          type: array
          items: { type: string }
        conditions:
          type: array
          items: { type: string }
        weights:
          $ref: "#/components/schemas/DEAWeights"
    Evidence:
      type: object
      required: [id, title, source, year, domain, excerpt, evidence_grade, relevance, recency, risk_level]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        year: { type: number }
        domain: { type: string }
        excerpt: { type: string }
        evidence_grade: { type: number }
        relevance: { type: number }
        recency: { type: number }
        risk_level: { type: string }
        page:
          type: ["number", "null"]
        chunk: { type: string }
        similarity: { type: number }
        metadata:
          type: object
          additionalProperties: true
    AgentStatus:
      type: object
      required: [agent, status, summary]
      properties:
        agent: { type: string }
        status: { type: string }
        summary: { type: string }
    ClinicalAgentOutput:
      type: object
      required: [agent, claims, recommendations, evidence, evidence_grade, relevance, recency, source, year]
      properties:
        agent: { type: string }
        claims: { type: array, items: { type: string } }
        recommendations: { type: array, items: { type: string } }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        evidence_grade: { type: number }
        relevance: { type: number }
        recency: { type: number }
        source: { type: string }
        year: { type: number }
    DrugAgentOutput:
      type: object
      required: [agent, drug, contraindications, interactions, risk_level, patient_specific_risk, evidence_grade, source, year, evidence]
      properties:
        agent: { type: string }
        drug: { type: string }
        contraindications: { type: array, items: { type: string } }
        interactions: { type: array, items: { type: string } }
        risk_level: { type: string }
        patient_specific_risk: { type: number }
        evidence_grade: { type: number }
        source: { type: string }
        year: { type: number }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
    LiteratureAgentOutput:
      type: object
      required: [agent, findings, alternative_treatments, evidence_grade, relevance, recency, source, year, evidence]
      properties:
        agent: { type: string }
        findings: { type: array, items: { type: string } }
        alternative_treatments: { type: array, items: { type: string } }
        evidence_grade: { type: number }
        relevance: { type: number }
        recency: { type: number }
        source: { type: string }
        year: { type: number }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
    Conflict:
      type: object
      required: [conflict_detected, conflict_type, severity, description, affected_treatment, risk_factor]
      properties:
        conflict_detected: { type: boolean }
        conflict_type: { type: string }
        severity: { type: string }
        description: { type: string }
        affected_treatment: { type: string }
        risk_factor: { type: string }
        status: { type: string }
        evidence_linkage: { type: string }
        engineering_assumption: { type: string }
        heuristic_fallback: { type: boolean }
        transaminase_evaluation_method: { type: string }
        provenance:
          type: ["object", "null"]
          additionalProperties: true
    CandidateScore:
      type: object
      required: [candidate, q_grade, s_rel, t_recent, p_risk, score, ranking, source]
      properties:
        candidate: { type: string }
        q_grade: { type: number }
        s_rel: { type: number }
        t_recent: { type: number }
        p_risk: { type: number }
        score: { type: number }
        ranking: { type: number }
        source: { type: string }
        contraindicated_flag: { type: boolean }
        safety_rationale: { type: string }
        silo: { type: string }
    DEAResult:
      type: object
      required: [weights, candidates, method_note]
      properties:
        weights:
          type: object
          required: [alpha, beta, gamma, delta]
          properties:
            alpha: { type: number }
            beta: { type: number }
            gamma: { type: number }
            delta: { type: number }
        candidates: { type: array, items: { $ref: "#/components/schemas/CandidateScore" } }
        method_note: { type: string }
    AnalysisReport:
      type: object
      required: [id, mode, patient_summary, query_tasks, agent_statuses, clinical, drug, literature, conflicts, dea, explanation, limitations, disclaimer, generated_at, retrieval_status]
      properties:
        id: { type: string }
        mode: { type: string }
        patient_summary: { type: string }
        query_tasks:
          type: object
          required: [clinical, drug, literature]
          properties:
            clinical: { type: string }
            drug: { type: string }
            literature: { type: string }
        agent_statuses: { type: array, items: { $ref: "#/components/schemas/AgentStatus" } }
        clinical: { $ref: "#/components/schemas/ClinicalAgentOutput" }
        drug: { $ref: "#/components/schemas/DrugAgentOutput" }
        literature: { $ref: "#/components/schemas/LiteratureAgentOutput" }
        conflicts: { type: array, items: { $ref: "#/components/schemas/Conflict" } }
        dea: { $ref: "#/components/schemas/DEAResult" }
        explanation: { type: string }
        safety_considerations: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        disclaimer: { type: string }
        generated_at: { type: string }
        claim_verifications:
          type: array
          items: { $ref: "#/components/schemas/ClaimVerification" }
        routing: { $ref: "#/components/schemas/SmartRouting" }
        reconciliation: { $ref: "#/components/schemas/MedicationReconciliationReport" }
        retrieval_status:
          type: object
          required: [database, embedding_provider, silo_isolation, top_k]
          properties:
            database: { type: string }
            embedding_provider: { type: string }
            silo_isolation: { type: boolean }
            top_k: { type: number }
    DemoCase:
      type: object
      required: [id, title, description, conflict_profile, patient]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        conflict_profile: { type: string }
        patient: { $ref: "#/components/schemas/PatientProfileInput" }
    EvaluationInput:
      type: object
      required: [dataset_name]
      properties:
        dataset_name: { type: string }
    EvaluationMetric:
      type: object
      required: [name, description, status, value]
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string }
        value:
          type: ["number", "null"]
        single_agent_value:
          type: ["number", "null"]
        multi_agent_value:
          type: ["number", "null"]
        dea_value:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
    EvaluationResult:
      type: object
      required: [dataset_name, benchmark_status, metrics]
      properties:
        dataset_name: { type: string }
        benchmark_status: { type: string }
        cases_evaluated:
          type: ["number", "null"]
        metrics: { type: array, items: { $ref: "#/components/schemas/EvaluationMetric" } }
    IngestDocumentInput:
      type: object
      required: [title, domain, source, year, evidence_grade, risk_level, content]
      properties:
        title: { type: string }
        domain: { type: string }
        source: { type: string }
        year: { type: number }
        evidence_grade: { type: number }
        risk_level: { type: string }
        content: { type: string }
        file_name: { type: string }
        file_content_base64: { type: string }
    IngestReceipt:
      type: object
      required: [document_id, collection, chunk_count, status, synthetic_notice]
      properties:
        document_id: { type: string }
        collection: { type: string }
        chunk_count: { type: number }
        status: { type: string }
        synthetic_notice: { type: string }
        indexed_at: { type: string }
    KnowledgeSilo:
      type: object
      required: [domain, collection, document_count, chunk_count, source_names, status, embedding_model]
      properties:
        domain: { type: string }
        collection: { type: string }
        document_count: { type: number }
        chunk_count: { type: number }
        source_names: { type: array, items: { type: string } }
        status: { type: string }
        embedding_model: { type: string }
        last_indexed_at:
          type: ["string", "null"]
    KnowledgeStats:
      type: object
      required: [database, database_path, embedding_provider, silos]
      properties:
        database: { type: string }
        database_path: { type: string }
        embedding_provider: { type: string }
        silos: { type: array, items: { $ref: "#/components/schemas/KnowledgeSilo" } }
    DEAWeights:
      type: object
      required: [alpha, beta, gamma, delta]
      properties:
        alpha: { type: number }
        beta: { type: number }
        gamma: { type: number }
        delta: { type: number }
    ClaimVerification:
      type: object
      required: [claim, status]
      properties:
        claim: { type: string }
        status:
          type: string
          enum: [supported, weak, unsupported]
        confidence: { type: number }
        source_title: { type: string }
        source_id: { type: string }
        identifier: { type: string }
        matched_excerpt: { type: string }
        domain: { type: string }
        token_overlap: { type: number }
    SmartRouting:
      type: object
      required: [tier, needs_doctor_review, complexity_score, recommended_model, routing_reasons]
      properties:
        tier: { type: string }
        needs_doctor_review: { type: boolean }
        complexity_score: { type: number }
        recommended_model: { type: string }
        routing_reasons:
          type: array
          items: { type: string }
    MedicationDiscrepancy:
      type: object
      properties:
        type: { type: string }
        medication: { type: string }
        admission_dose: { type: string }
        discharge_dose: { type: string }
        admission_frequency: { type: string }
        discharge_frequency: { type: string }
        details: { type: string }
        risk_level: { type: string }
        clinical_hazard: { type: string }
    MedicationReconciliationReport:
      type: object
      required: [has_discrepancy, has_high_risk_discrepancy]
      properties:
        total_list_a: { type: number }
        total_list_b: { type: number }
        missing_in_discharge:
          type: array
          items: { type: string }
        added_in_discharge:
          type: array
          items: { type: string }
        dose_discrepancy:
          type: array
          items:
            $ref: "#/components/schemas/MedicationDiscrepancy"
        frequency_discrepancy:
          type: array
          items:
            $ref: "#/components/schemas/MedicationDiscrepancy"
        therapeutic_duplications:
          type: array
          items:
            $ref: "#/components/schemas/MedicationDiscrepancy"
        high_risk_discrepancies:
          type: array
          items:
            $ref: "#/components/schemas/MedicationDiscrepancy"
        has_discrepancy: { type: boolean }
        has_high_risk_discrepancy: { type: boolean }
        discrepancies:
          type: array
          items:
            $ref: "#/components/schemas/MedicationDiscrepancy"
        summary: { type: string }
        safe_to_proceed: { type: boolean }
    ReconciliationInput:
      type: object
      properties:
        clinic_medications:
          type: array
          items: { type: string }
        discharge_medications:
          type: array
          items: { type: string }
        list_a:
          type: array
          items: { type: string }
        list_b:
          type: array
          items: { type: string }
        patient:
          $ref: "#/components/schemas/PatientProfileInput"
    WhatIfInput:
      type: object
      required: [patient]
      properties:
        patient:
          $ref: "#/components/schemas/PatientProfileInput"
        weights:
          $ref: "#/components/schemas/DEAWeights"

